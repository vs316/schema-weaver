<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strand — Collaborative Diagrams, Docs & Data Models</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta
      name="description"
      content="Strand is a fast, keyboard-first workspace for ERDs, UML, flowcharts, sequence and Mermaid diagrams, plus live collaborative docs."
    />
    <meta property="og:title" content="Strand — Collaborative Diagrams, Docs & Data Models" />
    <meta
      property="og:description"
      content="Strand: ERDs, UML, flowcharts, sequence and Mermaid diagrams with your team in real time."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply appearance immediately to prevent flash of unstyled UI
      (function () {
        try {
          var raw = localStorage.getItem("ds-appearance");
          var a = raw ? JSON.parse(raw) : {};
          var theme = a.theme || localStorage.getItem("erd-theme") || localStorage.getItem("theme") || "dark";
          if (theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var root = document.documentElement;
          root.classList.remove("light", "dark", "contrast");
          root.classList.add(theme);
          root.style.colorScheme = theme === "light" ? "light" : "dark";
          root.classList.add("density-" + (a.density || "cozy"));
          root.classList.add("scale-" + (a.scale || "md"));
          root.classList.add("font-app-" + (a.font || "sans"));
          if (a.reducedMotion) root.classList.add("reduce-motion");
        } catch (e) {
          document.documentElement.classList.add("dark", "density-cozy", "scale-md", "font-app-sans");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Load React app -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
